name: Update Fund NAV Data

on:
  schedule:
    # 11:11 UTC = 18:11 Vietnam (after market close)
    # Run Mon-Fri for fund NAV; also Sat-Sun so Bitcoin (24/7) stays current
    - cron: '11 11 * * *'
  workflow_dispatch: # Allow manual trigger

# Serialize with update_stocks.yml so two runs never push at the same time
concurrency:
  group: data-push
  cancel-in-progress: false

jobs:
  update-nav:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install vnstock
        # TEMPORARY: PyPI quarantined both the vnstock and vnai projects
        # (2026-09-24), so `pip install vnstock==...` finds no files. vnstock is
        # pinned by git SHA (4.0.8 — includes the fix for the UnboundLocalError
        # that banned 4.0.6); the required vnai dependency comes from the official
        # vendor index. Revert to `pip install vnstock==<ver>` once PyPI unblocks.
        run: >
          pip install --extra-index-url https://vnstocks.com/api/simple
          git+https://github.com/thinh-vu/vnstock@9c0a7bc7a29bd495e42916276615e1588abaf6b5

      - name: Verify vnstock
        run: python -c "import vnstock, importlib.metadata as m; v=m.version('vnstock'); assert v=='4.0.8', v; print('vnstock', v)"

      - name: Register vnstock API key
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: python -X utf8 -c "import os; from vnstock import register_user; register_user(api_key=os.environ['VNSTOCK_API_KEY'])"

      - name: Update NAV data
        run: node scripts/update_nav.mjs
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}

      - name: Update ETF and BTC data
        run: python -X utf8 scripts/update_vnstock.py
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}

      - name: Update fund holdings (Overlap tab)
        run: python -X utf8 scripts/fund_report/update_holdings.py
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}

      - name: Update digiinvest funds (TCBF, TCEF)
        run: node scripts/update_TCEF_TCBF_digiinvest.mjs

      - name: Update gold price data
        run: node scripts/update_gold.mjs

      - name: Check for changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain -- public/data)" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git commit -m "Update fund NAV data $(date -u +%Y-%m-%d)"
          for attempt in 1 2; do
            if git pull --rebase origin master && git push; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            if [ "$attempt" -lt 2 ]; then
              echo "Push attempt $attempt failed, retrying..."
              sleep 10
            else
              echo "Push attempt $attempt failed, giving up."
            fi
          done
          exit 1
